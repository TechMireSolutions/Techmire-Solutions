name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3 
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Set the project path based on your VPS setup
            # If your app is in a specific directory, cd into it
            # Using the previous workflow's path as an example, but adjust if needed
            PROJECT_DIR="/www/wwwroot/techmiresolutions.com"
            cd $PROJECT_DIR
            
            # Fetch the latest code and hard reset to the deployed commit
            git fetch origin main
            git reset --hard ${{ github.sha }}
            
            # Ensure the script is executable
            chmod +x scripts/deploy-remote.sh
            
            # Run the deployment script
            ./scripts/deploy-remote.sh